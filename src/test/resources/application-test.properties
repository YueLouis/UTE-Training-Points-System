spring.config.activate.on-profile=test

# Test Database (H2 in-memory)
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=false
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# Flyway disabled for tests
spring.flyway.enabled=false

# Logging
logging.level.root=WARN
logging.level.vn.hcmute=DEBUG

# JWT
jwt.secret=test_secret_key_for_unit_tests_min_256_bits_length

springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false

app.reset.pepper=test_reset_pepper_for_integration_tests
app.reset.frontend-url=http://localhost:3000/reset-password
app.mail.from=test@example.com
resend.api-key=test-key

