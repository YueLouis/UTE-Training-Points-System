spring:
  config:
    activate:
      on-profile: production
  datasource:
    url: ${DATABASE_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
    show-sql: false
    properties:
      hibernate:
        format_sql: false
  flyway:
    enabled: true
    baseline-on-migrate: false
    validate-on-migrate: true
    clean-disabled: true

# ⚠️ Railway blocks SMTP on Free/Hobby plans
# Use Resend API (HTTPS) instead
# spring.mail is NOT used in production

logging:
  level:
    root: WARN
    vn.hcmute.trainingpoints: INFO
    org.springframework.web: WARN
    org.springframework.security: WARN
    org.hibernate: WARN
    org.flywaydb: WARN

jwt:
  secret: ${JWT_SECRET}
  access:
    expiration: ${JWT_ACCESS_EXPIRATION:1800000}
  refresh:
    expiration: ${JWT_REFRESH_EXPIRATION:604800000}

resend:
  api-key: ${RESEND_API_KEY}

app:
  reset:
    token:
      expiry-minutes: ${RESET_TOKEN_EXPIRY:15}
    pepper: ${RESET_PEPPER}
    frontend-url: ${RESET_FRONTEND_URL}
  mail:
    from: ${MAIL_FROM}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS}
  security:
    trust-forwarded-headers: ${TRUST_FORWARDED_HEADERS:false}

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

server:
  port: ${PORT:8080}
  error:
    include-message: never
    include-binding-errors: never
    include-stacktrace: never
